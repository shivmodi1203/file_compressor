[project]
name = "file-compressor"
version = "0.1.0"
description = "Desktop app to reduce the size of images, PDFs, Office documents and other files"
requires-python = ">=3.10"
dependencies = [
    # 6.12.0 corrupts the refcount of None on Python < 3.12 and crashes.
    "PySide6-Essentials>=6.6,<6.12",
    "Pillow>=10.1",
    "pikepdf>=8.0",
    "py7zr>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.3"]

[project.gui-scripts]
file-compressor = "file_compressor.app:main"

[tool.setuptools.packages.find]
include = ["file_compressor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
